<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System - Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased text-slate-700 bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="view-section w-full max-w-md p-8 space-y-6 bg-white rounded-3xl shadow-xl border border-slate-100">
        <!-- Brand Header -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 text-3xl shadow-sm mb-4">
                🏥
            </div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">CarePoint Health</h1>
            <p class="text-xs font-medium text-gray-400 mt-1 uppercase tracking-wider">Hospital Management System</p>
        </div>

        <!-- Role Options -->
        <div id="login-options" class="space-y-3">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider text-center mb-2">Select Your Portal</p>
            
            <button class="w-full flex items-center p-3.5 rounded-xl border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all group" onclick="showLogin('admin')">
                <span class="w-10 h-10 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl mr-3 group-hover:scale-105 transition-transform">⚙️</span>
                <div class="text-left flex-1">
                    <p class="font-semibold text-gray-800 text-sm">Hospital Admin</p>
                    <p class="text-xs text-gray-500">Manage doctors, patients & inventory</p>
                </div>
                <span class="text-gray-400 group-hover:text-indigo-600 font-bold">→</span>
            </button>

            <button class="w-full flex items-center p-3.5 rounded-xl border border-gray-200 hover:border-emerald-500 hover:bg-emerald-50/50 transition-all group" onclick="showLogin('doctor')">
                <span class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl mr-3 group-hover:scale-105 transition-transform">🩺</span>
                <div class="text-left flex-1">
                    <p class="font-semibold text-gray-800 text-sm">Doctor Portal</p>
                    <p class="text-xs text-gray-500">Appointments, patients & prescriptions</p>
                </div>
                <span class="text-gray-400 group-hover:text-emerald-600 font-bold">→</span>
            </button>

            <button class="w-full flex items-center p-3.5 rounded-xl border border-gray-200 hover:border-purple-500 hover:bg-purple-50/50 transition-all group" onclick="showLogin('receptionist')">
                <span class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-xl mr-3 group-hover:scale-105 transition-transform">📋</span>
                <div class="text-left flex-1">
                    <p class="font-semibold text-gray-800 text-sm">Receptionist Desk</p>
                    <p class="text-xs text-gray-500">Patient registration & appointments</p>
                </div>
                <span class="text-gray-400 group-hover:text-purple-600 font-bold">→</span>
            </button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="hidden space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                <button type="button" onclick="backToRoles()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center">
                    ← Change Role
                </button>
                <span class="text-xs text-gray-400">Secure Access</span>
            </div>

            <h2 id="login-title" class="text-xl font-bold text-center text-gray-800">Login</h2>
            <input type="hidden" id="login-role" value="">

            <!-- Doctor Selector (Shown only when Doctor role selected) -->
            <div id="doctor-selector-wrap" class="hidden">
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Select Doctor Profile</label>
                <select id="doctor-profile-select" class="w-full px-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Username</label>
                <input type="text" id="username" class="w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter username" required>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter password" required>
            </div>

            <!-- Demo Credential Hint -->
            <div id="credential-hint" class="p-2.5 bg-gray-50 rounded-lg text-xs text-gray-600 border border-gray-100 text-center"></div>

            <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm shadow-md transition-all">
                Sign In to Portal
            </button>

            <p id="error-message" class="text-xs text-center text-rose-500 font-medium min-h-[16px]"></p>
        </form>

        <!-- Footer note -->
        <div class="text-center pt-2 border-t border-gray-100">
            <span class="text-[11px] text-gray-400">CarePoint Hospital Management • Version 2.0</span>
        </div>
    </div>

    <!-- Scripts in proper js/ directory -->
    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
