version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicore_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medicore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: medicore_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/medicore_db?schema=public
      JWT_SECRET: medicore_production_jwt_secret_key_2026
      AI_SERVICE_URL: http://ai_engine:8000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  ai_engine:
    build:
      context: ../ai-engine
      dockerfile: ../docker/Dockerfile.ai
    container_name: medicore_ai
    restart: always
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: medicore_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
